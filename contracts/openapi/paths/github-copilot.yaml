paths:
  /api/v1/copilot/status:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotStatus
      summary: Read the viewer-safe Copilot connection state
      responses:
        '200':
          description: Configured organizations and the viewer's explicit GitHub mapping
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotStatus
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/oauth/config:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotOAuthConfig
      summary: Read the origin-scoped GitHub OAuth App configuration
      description: Owner only. The client secret is never returned.
      responses:
        '200':
          description: Sanitized configuration and effective callback URL
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotOAuthConfigSummary
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    put:
      tags:
      - GitHub Copilot
      operationId: saveCopilotOAuthConfig
      summary: Save an origin-scoped GitHub OAuth App configuration
      description: 'Owner only. The client secret is encrypted before storage. An omitted secret

        retains the existing encrypted value for this origin.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotOAuthConfigWrite
      responses:
        '200':
          description: Sanitized saved configuration
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotOAuthConfigSummary
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/oauth/login:
    get:
      tags:
      - GitHub Copilot
      operationId: startCopilotOAuth
      summary: Start linking the current Turnstile session to a GitHub account
      parameters:
      - name: return_path
        in: query
        schema:
          type: string
          maxLength: 1000
          default: /?page=finops-overview&source=github-copilot
      responses:
        '302':
          description: Redirect to GitHub authorization
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/oauth/callback:
    get:
      tags:
      - GitHub Copilot
      operationId: completeCopilotOAuth
      summary: Complete GitHub account linking for the current Turnstile session
      security: []
      description: 'The callback does not require a session cookie because the browser may start on

        localhost and return to the configured test/production callback origin. Instead,

        it consumes a cryptographically random, single-use, ten-minute state bound to the

        initiating application user and callback origin. It reads the transient GitHub

        identity, verifies default-organization membership when configured, and persists

        only the GitHub login mapping.

        '
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the initiating Turnstile page
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/connections:
    put:
      tags:
      - GitHub Copilot
      operationId: saveCopilotConnection
      summary: Validate and save an encrypted organization billing connection
      description: 'Owner only. The server verifies the token against the requested organization and

        Copilot billing endpoint before encrypting it. The token is write-only. GitHub

        mutation remains disabled unless write_enabled is explicitly set.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotConnectionWrite
      responses:
        '200':
          description: Sanitized saved connection
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotConnectionSummary
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/dashboard:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotDashboard
      summary: Read organization or personal Copilot usage and billing
      description: 'Owners receive organization members and aggregate usage. Members are restricted

        server-side to the GitHub login explicitly mapped to their application account.

        '
      parameters:
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      responses:
        '200':
          description: Normalized Copilot subscription, usage, billing, and member data
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotDashboard
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '503':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/governance:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotGovernance
      summary: Read live Enterprise teams, cost centers, seats, and budgets
      description: Owner only. Each domain is read directly from GitHub and degrades independently.
      parameters:
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      responses:
        '200':
          description: Live Enterprise governance aggregate
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotGovernance
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/usage-imports:
    get:
      tags:
      - GitHub Copilot
      operationId: listCopilotUsageImports
      summary: List supplemental GitHub CSV imports
      description: Owner only. Files are never persisted to local disk.
      parameters:
      - name: source_kind
        in: query
        required: true
        schema:
          $ref: ../../openapi.yaml#/components/schemas/CopilotUsageImportKind
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      responses:
        '200':
          description: Import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/CopilotUsageImportSummary
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
      tags:
      - GitHub Copilot
      operationId: importCopilotUsageCsv
      summary: Import a supplemental GitHub AI Usage or Usage Report CSV
      description: 'Owner only. The request body is parsed in memory with a 5 MB and 25,000-row

        limit, normalized, SHA-256 deduplicated, and written transactionally to PostgreSQL.

        '
      parameters:
      - name: filename
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '201':
          description: Accepted import and row-level deduplication counts
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotUsageImportSummary
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '413':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '415':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/imported-usage:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotImportedUsage
      summary: Read database-aggregated supplemental GitHub CSV usage
      description: Owner only. Live GitHub APIs remain the primary data source.
      parameters:
      - name: source_kind
        in: query
        required: true
        schema:
          $ref: ../../openapi.yaml#/components/schemas/CopilotUsageImportKind
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      responses:
        '200':
          description: Supplemental usage KPIs, trends, breakdowns, and user rows
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotImportedUsage
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/cost-centers/options:
    get:
      tags:
      - GitHub Copilot
      operationId: getCopilotCostCenterOptions
      summary: List live GitHub Enterprise cost centers available to the viewer
      parameters:
      - name: organization
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 39
      responses:
        '200':
          description: Live cost center options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterOption
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '502':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/cost-center-requests:
    get:
      tags:
      - GitHub Copilot
      operationId: listCopilotCostCenterRequests
      summary: List cost center requests visible to the current viewer
      description: Owners see all requests. Members see only requests from their account.
      responses:
        '200':
          description: Role-scoped cost center request list
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterRequestList
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
      tags:
      - GitHub Copilot
      operationId: createCopilotCostCenterRequest
      summary: Request assignment to an active GitHub cost center
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterRequestCreate
      responses:
        '201':
          description: Created pending request
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterRequest
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/cost-center-requests/{request_id}/review:
    post:
      tags:
      - GitHub Copilot
      operationId: reviewCopilotCostCenterRequest
      summary: Approve or reject a pending cost center assignment request
      description: 'Owner only. A GitHub resource assignment occurs only when apply_to_github is true,

        the connection enables writes, and the target cost center is still active.

        '
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterRequestReview
      responses:
        '200':
          description: Reviewed request and GitHub synchronization result
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotCostCenterRequest
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/identities:
    get:
      tags:
      - GitHub Copilot
      operationId: listCopilotIdentities
      summary: List application users and explicit GitHub login mappings
      description: Owner only.
      responses:
        '200':
          description: Enabled application users and optional GitHub mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/CopilotIdentityMapping
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/identities/{app_user_id}:
    put:
      tags:
      - GitHub Copilot
      operationId: saveCopilotIdentity
      summary: Map one application user to one GitHub login
      description: Owner only. Email similarity is never accepted as identity proof.
      parameters:
      - name: app_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotIdentityWrite
      responses:
        '200':
          description: Saved identity mapping
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotIdentityMapping
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/budget-requests:
    get:
      tags:
      - GitHub Copilot
      operationId: listCopilotBudgetRequests
      summary: List Copilot budget requests visible to the current viewer
      description: Owners see all requests. Members see only requests from their account.
      responses:
        '200':
          description: Role-scoped request list and status counts
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotBudgetRequestList
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    post:
      tags:
      - GitHub Copilot
      operationId: createCopilotBudgetRequest
      summary: Submit a personal monthly AI-credit budget request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotBudgetRequestCreate
      responses:
        '201':
          description: Created pending request
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotBudgetRequest
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/budget-requests/{request_id}/review:
    post:
      tags:
      - GitHub Copilot
      operationId: reviewCopilotBudgetRequest
      summary: Approve or reject a pending Copilot budget request
      description: 'Owner only. Approval updates Turnstile first. A real GitHub budget is created or

        updated only when apply_to_github is true and the connection also enables writes.

        '
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/CopilotBudgetRequestReview
      responses:
        '200':
          description: Reviewed request and GitHub synchronization result
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/CopilotBudgetRequest
        '403':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/assistant/ask:
    post:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: askCopilotAssistant
      summary: Ask a grounded question about GitHub Copilot usage and budgets
      description: 'Uses a distinct conversation namespace and telemetry identity from the APIM

        assistant. Its tools are read-only and expose normalized Copilot data only.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/AssistantAskRequest
      responses:
        '200':
          description: Grounded answer and read-only tool evidence
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/AssistantReply
        '409':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        '422':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/assistant/conversations:
    get:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: listCopilotAssistantConversations
      summary: List the caller's recent Copilot assistant conversations
      responses:
        '200':
          description: Copilot conversation summaries
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ConversationList
        '401':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/assistant/conversations/{conversation_id}:
    get:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: getCopilotAssistantConversation
      summary: Read one Copilot assistant conversation
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/ConversationId
      responses:
        '200':
          description: Stored Copilot conversation and exchanges
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Conversation
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    patch:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: renameCopilotAssistantConversation
      summary: Rename one Copilot assistant conversation
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/ConversationId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ConversationRename
      responses:
        '200':
          description: Renamed Copilot conversation
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/Conversation
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
    delete:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: deleteCopilotAssistantConversation
      summary: Delete one Copilot assistant conversation
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/ConversationId
      responses:
        '204':
          description: Deleted
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
  /api/v1/copilot/assistant/conversations/{conversation_id}/title:
    post:
      tags:
      - GitHub Copilot
      - Assistant
      operationId: titleCopilotAssistantConversation
      summary: Name a Copilot assistant conversation from its first exchange
      parameters:
      - $ref: ../../openapi.yaml#/components/parameters/ConversationId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../openapi.yaml#/components/schemas/ConversationTitleRequest
      responses:
        '200':
          description: Copilot conversation summary
          content:
            application/json:
              schema:
                $ref: ../../openapi.yaml#/components/schemas/ConversationSummary
        '404':
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
        default:
          $ref: ../../openapi.yaml#/components/responses/ErrorResponse
